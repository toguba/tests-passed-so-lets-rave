<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tests Passed Rave</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #020408;
  }
  body.idle { cursor: none; }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* CRT-ish scanlines + vignette */
  .fx { position: fixed; inset: 0; pointer-events: none; }
  .fx.scan {
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 3px);
    mix-blend-mode: multiply;
  }
  .fx.vignette { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.75) 100%); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="fx scan"></div>
<div class="fx vignette"></div>

<!-- Options live in config.js or URL parameters (see README.md). -->
<script src="config.js"></script>
<script src="rave.js"></script>
</body>
</html>
